<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Salud Mental</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f4f8;
      color: #334e68;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background-color: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(16, 42, 67, 0.1);
      max-width: 620px;
      width: 100%;
    }
    header { text-align: center; margin-bottom: 20px; }
    header h1 { color: #102a43; font-size: 1.6rem; margin-bottom: 5px; }
    .controls { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
    .filter-group { display: flex; justify-content: center; align-items: center; gap: 10px; }
    select { padding: 8px; border-radius: 6px; border: 1px solid #bcccdc; }
    .button-group { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    button {
      border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer;
      font-size: 0.95rem; font-weight: 600; color: #fff; background-color: #2cb1bc;
    }
    button:hover { background-color: #14919b; }
    .btn-secondary { background-color: #3e4c59; }
    .btn-clear { background-color: #e2e8f0; color: #334e68; }
    .status { text-align: center; color: #627d98; font-style: italic; padding: 20px; }
    .card {
      background-color: #f8fafc; border-left: 4px solid #2cb1bc;
      padding: 15px; margin-bottom: 12px; border-radius: 6px;
      display: flex; align-items: flex-start; gap: 15px;
    }
    .card-image { width: 50px; height: 50px; border-radius: 50%; overflow: hidden; background: #e6f6f7; flex-shrink: 0; }
    .card-image img { width: 100%; height: 100%; object-fit: cover; }
    .card h3 { font-size: 1rem; color: #102a43; margin-bottom: 5px; }
    .card p { font-size: 0.85rem; color: #486581; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Recursos de Salud Mental</h1>
      <p>Prueba directa de APIs JSON</p>
    </header>

    <div class="controls">
      <div class="filter-group">
        <label for="select-categoria">Categoría:</label>
        <select id="select-categoria">
          <option value="anxiety">Ansiedad</option>
          <option value="depression">Depresión</option>
          <option value="stress">Estrés</option>
        </select>
      </div>

      <div class="button-group">
        <button id="btn-tests">Cargar Tests</button>
        <button id="btn-secondary" class="btn-secondary" id="btn-quotes">Frase + Avatar</button>
        <button id="btn-limpiar" class="btn-clear">Limpiar</button>
      </div>
    </div>

    <div id="resultado">
      <p class="status">Haz clic en un botón para probar.</p>
    </div>
  </div>

  <script>
    const selectCategoria = document.getElementById('select-categoria');
    const btnTests = document.getElementById('btn-tests');
    const btnQuotes = document.getElementById('btn-secondary'); // Usando el ID corregido
    const btnLimpiar = document.getElementById('btn-limpiar');
    const contenedorResultado = document.getElementById('resultado');

    async function traducir(texto) {
      if (!texto) return '';
      try {
        const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(texto)}&langpair=en|es`);
        const data = await res.json();
        return data.responseData?.translatedText || texto;
      } catch (e) {
        return texto;
      }
    }

    btnTests.addEventListener('click', async () => {
      contenedorResultado.innerHTML = '<p class="status">Cargando tests...</p>';
      try {
        const res = await fetch('https://jsonplaceholder.typicode.com/posts?_limit=3');
        const lista = await res.json();
        contenedorResultado.innerHTML = '';
        
        for (let i = 0; i < lista.length; i++) {
          const trad = await traducir(lista[i].title);
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `<div><h3>Test de Salud Mental #${i+1}</h3><p>${trad}</p></div>`;
          contenedorResultado.appendChild(card);
        }
      } catch (err) {
        contenedorResultado.innerHTML = '<p class="status" style="color:red;">Error al cargar</p>';
      }
    });

    btnQuotes.addEventListener('click', async () => {
      contenedorResultado.innerHTML = '<p class="status">Cargando frase...</p>';
      try {
        const res = await fetch('https://dummyjson.com/quotes/random');
        const dato = await res.json();
        const fraseEs = await traducir(dato.quote);
        const avatar = `https://api.dicebear.com/8.x/initials/svg?seed=${encodeURIComponent(dato.author)}`;

        contenedorResultado.innerHTML = `
          <div class="card">
            <div class="card-image"><img src="${avatar}"></div>
            <div><h3>"${fraseEs}"</h3><p>— ${dato.author}</p></div>
          </div>
        `;
      } catch (err) {
        contenedorResultado.innerHTML = '<p class="status" style="color:red;">Error al cargar frase</p>';
      }
    });

    btnLimpiar.addEventListener('click', () => {
      contenedorResultado.innerHTML = '<p class="status">Pantalla limpia.</p>';
    });
  </script>
</body>
</html>
